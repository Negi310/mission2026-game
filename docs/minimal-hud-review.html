<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文字を減らしたプレイ画面UI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101f2a;color:#e9f4fa;font:16px/1.6 system-ui,sans-serif}main{max-width:1600px;margin:auto;padding:20px}h1{font-size:clamp(22px,4vw,32px);margin:0 0 10px}p{margin:8px 0 18px;color:#b8cedb}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}button,select{font:inherit;padding:9px 14px;border:1px solid #86cbe5;border-radius:10px;background:#203947;color:white;max-width:100%}button[aria-pressed=true]{background:#9be600;color:#132511;border-color:#9be600}figure{margin:0}img{display:block;width:100%;height:auto;border-radius:10px}figcaption{padding-top:12px;color:#bfd8e5}a{color:#80dcff}small{display:block;margin-top:18px;color:#a8bfcd}
</style>
<main>
<h1>文字を減らしたプレイ画面UI</h1>
<p>Unityの実ビルドを撮影した比較です。最新の調整では大きさを少し抑え、ptと時間に細い縁・淡い陰影・ハイライトを付けています。</p>
<div class="controls">
<button id="current" aria-pressed="true">整理後</button><button id="previous" aria-pressed="false">以前</button>
<select id="state" aria-label="確認する場面">
<optgroup label="最新"><option value="refined">通常</option><option value="refinedchain">チェイン</option><option value="refinedeffects">所持＋4効果</option><option value="refined720">1280×720</option></optgroup>
<optgroup label="以前の比較"><option value="soft">淡い背景：通常</option><option value="softchain">淡い背景：チェイン</option><option value="empty">枠なし：通常</option><option value="effects">所持＋4効果</option><option value="720">1280×720</option><option value="beam">レーザー＋待機武器</option><option value="narrow">1280×1024</option><option value="chain">背景カード付き：チェイン</option><option value="amusement">遊園地</option></optgroup>
</select>
</div>
<figure><a id="full-size"><img id="capture" alt="整理後の通常のプレイ画面"></a><figcaption id="caption"></figcaption></figure>
<small>取得と効果の同時表示を確認するため、シード2026、停止した戦車、診断用の取得処理を使っています。最新の通常／チェインは以前／現在で直前の淡い背景と比較できます。以前の比較画像も残しています。</small>
</main>
<script>
const scenes={refined:['refined-empty','最新：通常'],refinedchain:['refined-chain','最新：チェイン'],refinedeffects:['refined-effects','最新：所持＋4効果'],refined720:['refined-720','最新：1280×720'],soft:['soft-empty','淡い背景：通常'],softchain:['soft-chain','淡い背景：チェイン'],empty:['empty','枠なし：通常'],effects:['effects','所持＋4効果'],'720':['720','1280×720'],beam:['beam','レーザー＋待機武器'],narrow:['5x4','1280×1024'],chain:['chain','背景カード付き：チェイン'],amusement:['amusement','遊園地']};
const state=document.querySelector('#state'),picture=document.querySelector('#capture'),caption=document.querySelector('#caption'),link=document.querySelector('#full-size'),current=document.querySelector('#current'),previous=document.querySelector('#previous');
let old=false;
function update(){const scene=scenes[state.value],prior={refined:'soft-empty',refinedchain:'soft-chain',refinedeffects:'effects',refined720:'720',soft:'empty',softchain:'chain'},before=prior[state.value]?'images/tank-town-minimal-hud-'+prior[state.value]+'.png':'images/tank-town-hud-CandyTown-04-held-and-auto.png',src=old?before:'images/tank-town-minimal-hud-'+scene[0]+'.png';picture.src=src;picture.alt=(old?'以前：':'整理後：')+scene[1].replace('最新：','');link.href=src;caption.textContent=picture.alt+'（画像をクリックすると原寸表示）';current.setAttribute('aria-pressed',String(!old));previous.setAttribute('aria-pressed',String(old));state.disabled=old;}
current.onclick=()=>{old=false;update()};previous.onclick=()=>{old=true;update()};state.onchange=update;update();
</script>
</html>
