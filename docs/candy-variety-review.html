<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拡大したお菓子の街 — Unity実画面</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1720;color:#eef8ff;font:15px/1.6 'Yu Gothic',Meiryo,sans-serif}main{max-width:1600px;padding:28px;margin:auto}h1{font-size:25px}p{color:#b8d1dd}a{color:#82e7ff}.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));gap:20px}figure{margin:0;border:1px solid #426777;border-radius:12px;overflow:hidden;background:#173445}img{display:block;width:100%;height:auto}figcaption{padding:12px 14px;font-weight:bold}</style>
<main><h1>拡大したお菓子の街</h1><p>UnityのWindowsプレイヤーで撮影しました。536×536のフィールドと、入口・部分破壊・全壊報酬を持つ6種類の家です。近接画面と全景は診断用カメラです。画像を押すと原寸で開けます。<a href="candy-expansion-validation.md">検証記録</a></p><div class="shots" id="shots"></div></main>
<script>
for(const [file,title] of [['19-expanded-overview','面積4倍の全景'],['16-pink-shop','ピンクのキャンディショップ'],['17-aqua-ice-cream','水色のアイスクリームショップ'],['18-cupcake-cafe','カップケーキの家'],['12-strawberry-tiers','各段のイチゴをクリームに埋め込む'],['20-seated-roof-berries','屋上のイチゴも約半分を埋め込む'],['02-play','実際のプレイ画面'],['04-chocolate-hit','砲撃による部分破壊']]){const figure=document.createElement('figure'),link=document.createElement('a'),image=document.createElement('img'),caption=document.createElement('figcaption');link.href=image.src=`images/tank-town-expanded-candy-${file}.png`;image.alt=title;caption.textContent=title;link.append(image);figure.append(link,caption);document.getElementById('shots').append(figure)}
