<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TANK TOWN</title>
<style>body{margin:0;background:#111b32;color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh}header{display:flex;align-items:center;gap:14px;padding:10px 22px;background:#172441}b{color:#ffcf45;font-size:22px}button{border:0;border-radius:14px;background:#ff497c;color:white;padding:12px 18px;font-weight:700;cursor:pointer}#status{flex:1;font-size:13px;color:#c9def0}main{position:relative;flex:1;min-height:0;display:grid;place-items:center}canvas{width:100%;height:100%;object-fit:contain;outline:0}#loading{position:absolute;max-width:480px;background:#172441;padding:28px;border-radius:22px;line-height:1.8;text-align:center}progress{width:100%;accent-color:#ff497c}#error{color:#ffc0ca}footer{font-size:12px;text-align:center;padding:6px;color:#bacbe2}a{color:#a9ebff}@media(max-width:600px){header{flex-wrap:wrap;padding:8px}#status{order:3;flex-basis:100%}}</style></head>
<body><header><b>TANK TOWN</b><span id="status" aria-live="polite"></span><button id="connect" disabled>ハンドル接続</button><button id="fullscreen" disabled>全画面</button></header>
<main><canvas id="unity-canvas" tabindex="0"></canvas><div id="loading"><h2>街をじゅんび中！</h2><progress id="progress" max="1" value="0"></progress><p>初回は読み込みに時間がかかります。<br>PCのChrome / Edgeをおすすめします。</p><p id="error"></p></div></main>

<script src="Build/Web.loader.js?v=0.5.2"></script><script>
const status=document.getElementById('status'),canvas=document.getElementById('unity-canvas'),connect=document.getElementById('connect');
let server, characteristic;
const uuid=s=>'6e40000'+s+'-b5a3-f393-e0a9-e50e24dcca9e';
connect.onclick=async()=>{try{
 if(!navigator.bluetooth)throw Error('BluetoothはPCのChrome / Edgeで利用できます。キーボードでも遊べます。');
 connect.disabled=true;
 if(characteristic){characteristic.removeEventListener('characteristicvaluechanged',receive);await characteristic.stopNotifications();}
 if(server?.connected)server.disconnect();
 const device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[uuid('1')]});
 device.addEventListener('gattserverdisconnected',()=>{status.textContent='ハンドルが切断されました。再接続できます';connect.disabled=false;});
 server=await device.gatt.connect();const service=await server.getPrimaryService(uuid('1'));const chars=await service.getCharacteristics();
 characteristic=chars.find(c=>c.uuid===uuid('2')&&(c.properties.notify||c.properties.indicate))||chars.find(c=>c.properties.notify||c.properties.indicate);
 if(!characteristic)throw Error('UART通知が見つかりません');
 characteristic.addEventListener('characteristicvaluechanged',receive);await characteristic.startNotifications();
 status.textContent='接続済み・データ受信待ち';canvas.focus();
 }catch(error){status.textContent=error.message;}finally{connect.disabled=false;}};
function receive(event){const bytes=new Uint8Array(event.target.value.buffer,event.target.value.byteOffset,event.target.value.byteLength);const text=new TextDecoder().decode(bytes);if(window.tankTownReceiver&&window.tankTownInstance)window.tankTownInstance.SendMessage(window.tankTownReceiver,'ReceiveBrowserData',text);status.textContent='ハンドル接続中';}
canvas.addEventListener('keydown',event=>{if(['ArrowLeft','ArrowRight','Space','F7','F8'].includes(event.code))event.preventDefault();});
createUnityInstance(canvas,{dataUrl:'Build/Web.data.unityweb?v=0.5.2',frameworkUrl:'Build/Web.framework.js.unityweb?v=0.5.2',codeUrl:'Build/Web.wasm.unityweb?v=0.5.2',streamingAssetsUrl:'StreamingAssets',devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5),companyName:'Tank Town',productName:'Tank Town',productVersion:'0.5.2'},value=>document.getElementById('progress').value=value).then(instance=>{window.tankTownInstance=instance;document.getElementById('loading').hidden=true;connect.disabled=false;const full=document.getElementById('fullscreen');full.disabled=false;full.onclick=()=>instance.SetFullscreen(1);canvas.focus();}).catch(error=>{document.getElementById('error').textContent='起動できませんでした: '+error+'。再読み込みしてください。PCのChrome / Edgeをおすすめします。';});
</script></body></html>
